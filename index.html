<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Nest — Stories for every generation.</title>
<meta name="description" content="Reading Nest — a little library close to home. Browse books and request to borrow on WhatsApp.">
<style>
:root {
  --ink:#3f342c; --muted:#786b61; --paper:#fbf7f0; --card:#fffdf9;
  --accent:#7b5b43; --accent2:#a9825f; --line:#e8ddd0; --good:#58745b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--paper);color:var(--ink)}
header{padding:28px 20px 22px;text-align:center;border-bottom:1px solid var(--line);background:#f5eee4}
.brand{font-size:38px;letter-spacing:.5px;margin:0;font-weight:700}
.tagline{margin:7px 0 0;color:var(--muted);font-size:16px;font-style:italic}
.nestline{width:70px;height:2px;background:var(--accent2);margin:15px auto 0}
.controls{position:sticky;top:0;z-index:5;padding:15px 18px;background:rgba(251,247,240,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.controls-inner{max-width:1180px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}
input,select{font:inherit;border:1px solid #d9cabb;border-radius:10px;padding:11px 13px;background:white;color:var(--ink)}
input{flex:1;min-width:230px}
select{min-width:160px}
.summary{max-width:1180px;margin:20px auto 8px;padding:0 18px;color:var(--muted);font-size:14px}
.grid{max-width:1180px;margin:0 auto;padding:10px 18px 45px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 12px rgba(70,50,35,.06);display:flex;flex-direction:column}
.cover-wrap{height:250px;background:#eee5da;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:13px 13px 14px;display:flex;flex-direction:column;flex:1}
.title{font-weight:700;font-size:17px;line-height:1.25;margin-bottom:6px}
.author{font-size:13px;color:var(--muted);min-height:18px;margin-bottom:8px}
.meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.status{font-size:12px;font-weight:700;color:var(--good);margin-bottom:10px}
button{border:0;border-radius:9px;padding:10px 11px;background:var(--accent);color:white;font:inherit;cursor:pointer;margin-top:auto}
button:hover{background:#654a37}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}
footer{border-top:1px solid var(--line);text-align:center;padding:25px;color:var(--muted);font-size:13px}
@media(max-width:520px){.brand{font-size:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-left:12px;padding-right:12px}.cover-wrap{height:220px}.title{font-size:15px}.controls-inner{flex-direction:column}input,select{width:100%}}
</style>
</head>
<body>
<header>
  <h1 class="brand">READING NEST</h1>
  <div class="tagline">Stories for every generation.</div>
  <div class="nestline"></div>
</header>

<section class="controls">
  <div class="controls-inner">
    <input id="search" type="search" placeholder="Search by book title or author…">
    <select id="availability">

      <option value="available">Available</option>
      <option value="requested">Requested</option>
    </select>
  </div>
</section>

<div class="summary" id="summary"></div>
<main class="grid" id="grid"></main>

<footer>Reading Nest · Stories for every generation.</footer>

const WHATSAPP_NUMBER = "919840888568";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

const state = JSON.parse(localStorage.getItem("readingNestStatus") || "{}");

function currentStatus(book) {
  return state[book.id] || book.status;
}

function requestBook(id) {
  const book = BOOKS.find(b => b.id === id);
  if (!book) return;
  const message = `Hi, I would like to request the book '${book.title}'`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, "_blank");
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filter = document.getElementById("availability").value;
  const filtered = BOOKS.filter(b => {
    const matchesText = !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q);
    const st = currentStatus(b).toLowerCase();
    const matchesFilter = filter === "all" || (filter === "available" && st === "available") || (filter === "requested" && st === "requested");
    return matchesText && matchesFilter;
  });

  document.getElementById("summary").textContent = `Showing ${filtered.length} of ${BOOKS.length} books`;

  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No books found. Try another title or author.</div>';
    return;
  }

  grid.innerHTML = filtered.map(b => {
    const st = currentStatus(b);
    const available = st === "Available";
    return `<article class="card">
      <div class="cover-wrap"><img loading="lazy" src="${esc(b.cover)}" alt="Cover of ${esc(b.title)}" onerror="this.style.display='none'"></div>
      <div class="info">
        <div class="title">${esc(b.title)}</div>
        <div class="author">${esc(b.author || "Author not listed")}</div>
        <div class="meta">Book ID: RN-${String(b.id).padStart(4,"0")}</div>
        <div class="status">${available ? "● Available" : "● Requested"}</div>
        <button onclick="requestBook(${b.id})">${available ? "Request to book" : "Request anyway"}</button>
      </div>
    </article>`;
  }).join("");
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("availability").addEventListener("change", render);
render();
</script>
